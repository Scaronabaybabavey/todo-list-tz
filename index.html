<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Список задач</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>Список задач</h1>
      <p class="app__counter" id="counter"></p>
    </header>

    <form class="add-form" id="add-form" autocomplete="off">
      <input
        class="add-form__input"
        id="task-input"
        type="text"
        placeholder="Что нужно сделать?"
        maxlength="200"
        aria-label="Новая задача"
      >
      <button class="add-form__btn" type="submit">Добавить</button>
    </form>

    <div class="filters" id="filters">
      <button class="filters__btn is-active" data-filter="all">Все</button>
      <button class="filters__btn" data-filter="active">Активные</button>
      <button class="filters__btn" data-filter="done">Выполненные</button>
    </div>

    <ul class="list" id="task-list"></ul>
    <p class="empty" id="empty">Задач пока нет</p>

    <footer class="app__footer">
      <button class="clear-btn" id="clear-done" type="button">Удалить выполненные</button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
